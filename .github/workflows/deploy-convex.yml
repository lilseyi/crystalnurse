# Deploys the backend on every merge to main, then applies any pending data
# migrations.
#
# Order matters and is not negotiable: schema and functions go up FIRST, then
# migrations run against them. A migration that referenced a field the deployed
# schema didn't have yet would fail, and a migration running before new function
# code exists would run the old version.
name: Deploy backend

on:
  push:
    branches: [main]
    # No `paths:` filter. A migration can be triggered by a change in
    # packages/shared, and a filtered workflow that doesn't run is
    # indistinguishable from one that passed — deploy every time and let Convex
    # no-op when nothing changed.
  workflow_dispatch:

concurrency:
  # Never let two deploys race: the second could apply migrations against the
  # first's half-deployed functions.
  group: deploy-convex-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check required secrets
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is not set in the 'production' environment."
            echo "Get one from the Convex dashboard: Settings → Deploy keys."
            exit 1
          fi

      # @supa-media/* come from GitHub Packages, a private registry — see .npmrc.
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy schema and functions
        run: npx convex deploy --yes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # Applies anything in apps/convex/functions/migrations.ts that hasn't run
      # yet. Already-applied migrations are skipped, so re-running is harmless.
      - name: Run pending data migrations
        run: npx convex run functions/migrations:runPending --prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
