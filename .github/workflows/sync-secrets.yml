# Copies secrets from 1Password into this repo's GitHub environment secrets,
# via the shared Supa Framework workflow.
#
# ── The model ──────────────────────────────────────────────────────────────
# 1Password is the source of truth. GitHub secrets are a buffer that deploy
# workflows read from. So:
#
#   - Set or rotate a value in 1Password, then run this. Never edit a secret in
#     the GitHub UI — GitHub secrets are write-only (you can't read one back to
#     check it), and the next sync silently overwrites whatever you typed.
#   - Adding a secret means: create the 1Password item, add its key to
#     secrets-allowlist.json, and run this workflow. A key not on the allowlist
#     is never synced.
#
# Only secrets that GitHub Actions itself reads are synced. The backend's own
# secrets go 1Password -> Convex directly (`pnpm push:secrets --prod`).
#
# ── Prerequisites (seeded by hand, once) ───────────────────────────────────
# These two can't be synced by the thing that needs them to run:
#
#   OP_SERVICE_ACCOUNT_TOKEN  1Password service account token, scoped to the
#                             `Crystal` vault, read-only.
#                             1Password → Developer → Service Accounts.
#   GH_ADMIN_TOKEN            GitHub PAT with repo admin scope. The default
#                             GITHUB_TOKEN cannot manage repository or
#                             environment secrets — this is a hard limitation,
#                             not a permissions setting you can grant.
#
# No packages token is needed: the @supa-media/* packages are public, so this
# repo's own GITHUB_TOKEN can install them.
name: Sync secrets from 1Password

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to sync"
        required: true
        type: choice
        default: production
        options:
          - production
      dry-run:
        description: "Show what would change without changing it"
        required: false
        type: boolean
        default: true

  # Re-sync automatically when the allowlist changes, so adding a key to the
  # list is the only step needed to make it real.
  #
  # COMMENTED OUT until OP_SERVICE_ACCOUNT_TOKEN and GH_ADMIN_TOKEN are seeded —
  # otherwise the first merge that touches the allowlist fails noisily for a
  # reason that has nothing to do with the change. Uncomment once both exist.
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - secrets-allowlist.json
  #     - .github/workflows/sync-secrets.yml

jobs:
  sync:
    name: Sync ${{ inputs.environment || 'production' }} secrets
    uses: Supa-Media/supa-framework/.github/workflows/sync-secrets.yml@v1
    with:
      vault: Crystal
      allowlist-path: secrets-allowlist.json
      # `push` runs carry no `inputs`, so default explicitly.
      environment: ${{ inputs.environment || 'production' }}
      # Defaults to a dry run on manual dispatch: seeing the plan before it
      # writes is worth the extra click, since `optional` keys are pruned.
      dry-run: ${{ inputs.dry-run || false }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
