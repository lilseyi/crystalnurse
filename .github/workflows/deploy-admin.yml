# Publishes the admin portal to https://admin.crystalnurse.com on every merge to
# main, via EAS Hosting.
#
# ── Why EAS rather than a generic static host ──────────────────────────────
# The portal is an Expo app, so EAS hosts what it already builds: SPA routing
# works natively (no _redirects or 404.html workaround), and the same account
# and project handle native iOS/Android builds if caregivers ever need this on a
# phone. It also keeps DNS where it is — a custom domain here is three records
# added at the registrar, where a Cloudflare Pages custom domain would have
# required moving the whole crystalnurse.com zone, live Google Workspace email
# and all.
#
# ── One-time setup ─────────────────────────────────────────────────────────
#  1. Repo secrets (Settings → Environments → production):
#       EXPO_TOKEN               — expo.dev → Account settings → Access tokens
#       EXPO_PUBLIC_CONVEX_URL   — the production Convex URL (.convex.cloud)
#  2. Custom domain: expo.dev → this project → Hosting → Custom domain, then add
#     the three records it gives you at Squarespace (a verification TXT, an
#     _acme-challenge CNAME, and `admin` CNAME → origin.expo.app).
#     Requires an Expo Starter plan or above.
# ───────────────────────────────────────────────────────────────────────────
name: Deploy admin portal

on:
  push:
    branches: [main]
    paths:
      - "apps/ops/**"
      - "packages/shared/**"
      - "apps/convex/**" # generated API types the portal compiles against
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

concurrency:
  group: deploy-admin-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_CONVEX_URL: ${{ secrets.EXPO_PUBLIC_CONVEX_URL }}
        run: |
          for name in EXPO_TOKEN EXPO_PUBLIC_CONVEX_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::missing required secret '$name' in the 'production' environment."
              exit 1
            fi
          done

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The portal imports Convex's generated API types.
      - name: Generate Convex types
        run: npx convex codegen
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # EXPO_PUBLIC_CONVEX_URL is baked into the bundle at build time, not read
      # at runtime — a missing value ships a portal that can't reach the
      # backend, with no error until someone opens it. Hence the check above.
      - name: Build
        run: pnpm build:ops-web
        env:
          EXPO_PUBLIC_CONVEX_URL: ${{ secrets.EXPO_PUBLIC_CONVEX_URL }}

      - name: Deploy to EAS Hosting
        working-directory: apps/ops
        run: eas deploy --prod --non-interactive
